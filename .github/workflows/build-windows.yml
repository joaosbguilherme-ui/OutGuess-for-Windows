name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build executables
        working-directory: src
        run: make -f Makefile.mingw

      - name: Test command-line executable
        working-directory: src
        run: ./outguess.exe -h

      - name: Prepare ZIP
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'outguess-windows'
          $package = Join-Path $staging 'bin-win64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'src/outguess.exe', 'src/outguess-gui.exe', 'src/histogram.exe', 'src/capacity.exe', 'src/metadata.exe', 'src/batch.exe' $package
          Copy-Item 'README.md', 'README-WINDOWS.md', 'LICENSE' $staging
          $zip = Join-Path $env:GITHUB_WORKSPACE 'outguess-windows.zip'
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: outguess-windows-${{ github.sha }}
          path: outguess-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" outguess-windows.zip --generate-notes --title "OutGuess for Windows ${{ github.ref_name }}"
